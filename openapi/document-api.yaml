openapi: 3.1.0
info:
  title: Kindy Document Library API
  version: 2.0.0
  description: Host-side contract consumed by kindy-editor. Authentication is intentionally application-defined.
servers:
  - url: https://document-api.example.com
tags:
  - name: Documents
  - name: Versions
  - name: Artifacts
paths:
  /documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/FolderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Document page, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentPage' } } } }
    post:
      tags: [Documents]
      operationId: createDocument
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDocumentInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRecord' } } } }
  /documents/import:
    post:
      tags: [Documents]
      operationId: importDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata, state]
              properties:
                file: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document, contentEncoding: binary }
                metadata: { type: string, description: JSON encoded CreateDocumentInput }
                state: { type: string, description: JSON encoded KindyDocumentState }
                compatibilityReport: { type: string, description: JSON encoded CompatibilityReport }
      responses:
        '201': { description: Imported, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRecord' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /documents/{documentId}:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    get:
      tags: [Documents]
      operationId: getDocument
      responses:
        '200': { description: Document, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRecord' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Documents]
      operationId: updateDocument
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Updated document, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRecord' } } } }
  /documents/{documentId}/state:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    get:
      tags: [Documents]
      operationId: loadDocumentState
      parameters: [{ name: versionId, in: query, schema: { type: string } }]
      responses:
        '200': { description: Snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentSnapshot' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Documents]
      operationId: saveDocumentState
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveStateInput' } } } }
      responses:
        '200': { description: Save result, content: { application/json: { schema: { $ref: '#/components/schemas/SaveResult' } } } }
        '409': { description: Base revision no longer current, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /documents/{documentId}/versions:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    get:
      tags: [Versions]
      operationId: listDocumentVersions
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Version page, content: { application/json: { schema: { $ref: '#/components/schemas/VersionPage' } } } }
  /documents/{documentId}/versions/{versionId}/restore:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }, { $ref: '#/components/parameters/VersionId' }]
    post:
      tags: [Versions]
      operationId: restoreDocumentVersion
      responses:
        '200': { description: Restored snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentSnapshot' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/artifacts:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    post:
      tags: [Artifacts]
      operationId: storeDocumentArtifact
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, format]
              properties:
                file: { type: string, contentEncoding: binary }
                fileName: { type: string, description: Explicit filename for transports that do not preserve multipart Content-Disposition }
                format: { $ref: '#/components/schemas/ArtifactFormat' }
                versionId: { type: string }
                compatibilityReport: { type: string }
      responses:
        '201': { description: Artifact, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentArtifact' } } } }
  /documents/{documentId}/artifacts/{artifactId}:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }, { name: artifactId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Artifacts]
      operationId: getDocumentArtifact
      responses:
        '200': { description: Artifact metadata with a URL or an application-defined retrieval representation, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentArtifact' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /folders:
    get:
      operationId: listFolders
      parameters: [{ $ref: '#/components/parameters/Search' }]
      responses:
        '200': { description: Folders, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Folder' } } } } }
  /templates:
    get:
      operationId: listTemplates
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Template page, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentPage' } } } }
components:
  parameters:
    DocumentId: { name: documentId, in: path, required: true, schema: { type: string } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string } }
    Search: { name: search, in: query, schema: { type: string } }
    FolderId: { name: folderId, in: query, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    JsonContent: { type: object, additionalProperties: true }
    KindyPageState:
      type: object
      required: [size, orientation, margin]
      properties:
        size: { type: object, required: [width, height], properties: { width: { type: number }, height: { type: number } } }
        orientation: { enum: [portrait, landscape] }
        margin: { type: object, required: [top, right, bottom, left], properties: { top: { type: number }, right: { type: number }, bottom: { type: number }, left: { type: number } } }
        background: { type: string }
        watermark: { type: object, additionalProperties: true }
        sections: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    KindyDocumentState:
      type: object
      required: [schemaVersion, content, page, assets]
      properties:
        schemaVersion: { const: '2.0' }
        content: { $ref: '#/components/schemas/JsonContent' }
        page: { $ref: '#/components/schemas/KindyPageState' }
        assets: { type: array, items: { type: object, required: [id, kind], properties: { id: { type: string }, kind: { type: string }, url: { type: string }, mimeType: { type: string } }, additionalProperties: true } }
    DocumentRecord:
      type: object
      required: [id, title, fileName, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        fileName: { type: string }
        folderId: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        currentVersionId: { type: string }
        currentRevisionId: { type: string }
        isTemplate: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
        capabilities: { type: object, additionalProperties: { type: boolean } }
    CreateDocumentInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        fileName: { type: string }
        folderId: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        templateId: { type: string }
        state: { $ref: '#/components/schemas/KindyDocumentState' }
        metadata: { type: object, additionalProperties: true }
    DocumentVersion:
      type: object
      required: [id, documentId, number, revisionId, reason, createdAt]
      properties:
        id: { type: string }
        documentId: { type: string }
        number: { type: integer }
        revisionId: { type: string }
        reason: { enum: [create, import, autosave, manual, restore, template] }
        createdAt: { type: string, format: date-time }
        label: { type: string }
    DocumentSnapshot:
      type: object
      required: [document, state, revisionId]
      properties:
        document: { $ref: '#/components/schemas/DocumentRecord' }
        state: { $ref: '#/components/schemas/KindyDocumentState' }
        revisionId: { type: string }
        version: { $ref: '#/components/schemas/DocumentVersion' }
    SaveStateInput:
      type: object
      required: [state, baseRevisionId, reason, clientMutationId]
      properties:
        state: { $ref: '#/components/schemas/KindyDocumentState' }
        baseRevisionId: { type: string }
        reason: { enum: [autosave, manual] }
        clientMutationId: { type: string }
    SaveResult:
      type: object
      required: [revisionId, savedAt]
      properties:
        revisionId: { type: string }
        savedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/DocumentVersion' }
    ArtifactFormat: { enum: [docx, pdf, original-docx] }
    DocumentArtifact:
      type: object
      required: [id, documentId, format, fileName, mimeType, createdAt]
      properties:
        id: { type: string }
        documentId: { type: string }
        versionId: { type: string }
        format: { $ref: '#/components/schemas/ArtifactFormat' }
        fileName: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        url: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
    Folder:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string }, parentId: { type: [string, 'null'] } }
    DocumentPage:
      type: object
      required: [items, total, page, pageSize]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/DocumentRecord' } }, total: { type: integer }, page: { type: integer }, pageSize: { type: integer } }
    VersionPage:
      type: object
      required: [items, total, page, pageSize]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/DocumentVersion' } }, total: { type: integer }, page: { type: integer }, pageSize: { type: integer } }
    Error:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string }, details: {} }
