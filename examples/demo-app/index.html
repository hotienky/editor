<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kindy Editor - Demo Tích Hợp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-left">
        <div class="app-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span class="logo-title">Kindy Editor <span class="badge">v3.1.0</span></span>
        </div>
      </div>

      <div class="header-controls">
        <div class="control-group">
          <label for="lang-select">Ngôn ngữ:</label>
          <select id="lang-select" class="select-input">
            <option value="vi" selected>Tiếng Việt (VI)</option>
            <option value="en">English (EN)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="mode-select">Chế độ:</label>
          <select id="mode-select" class="select-input">
            <option value="edit" selected>Chỉnh sửa (Edit)</option>
            <option value="suggest">Gợi ý (Suggest)</option>
            <option value="view">Chỉ xem (View-only)</option>
          </select>
        </div>

        <button id="btn-export-pdf" class="btn btn-outline" title="Xuất file PDF">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export PDF
        </button>

        <button id="btn-export-docx" class="btn btn-outline" title="Xuất file Word DOCX">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export DOCX
        </button>

        <button id="btn-toggle-log" class="btn btn-secondary" title="Bật/Tắt bảng theo dõi Event">
          Logs Event (<span id="event-count">0</span>)
        </button>
      </div>
    </header>

    <main class="main-layout">
      <div id="editor-container" class="editor-wrapper"></div>
      
      <aside id="events-panel" class="events-panel hidden">
        <div class="panel-header">
          <h3>Public Events Log</h3>
          <button id="btn-clear-log" class="btn-sm">Xóa log</button>
        </div>
        <div id="events-log" class="log-content"></div>
      </aside>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
